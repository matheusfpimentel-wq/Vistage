  :root{
    --turq:#48C3C7; --turq-dark:#0e6b70; --dteal:#1E6F71;
    --green:#11983C; --orange:#FF3D00;
    --ink:#1f2a2c; --muted:#5b6a6c; --line:#e3e8e9;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink); background:#fff; line-height:1.5; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:480px;margin:0 auto;padding:16px 14px 30px}

  .stage{display:flex;gap:10px;align-items:stretch}
  .canvas-box{position:relative;flex:1 1 auto;min-width:0;border-radius:10px;overflow:hidden}
  canvas#view{display:block;width:100%;height:auto;touch-action:none;cursor:grab;background:transparent}
  canvas#view.dragging{cursor:grabbing}
  .vrange{
    flex:0 0 26px;align-self:stretch;margin:0;cursor:pointer;
    writing-mode:vertical-lr;direction:rtl;
    -webkit-appearance:slider-vertical;appearance:slider-vertical;
    accent-color:var(--dteal);
  }

  .progress{height:6px;border-radius:6px;background:#e3e8e9;margin:10px 2px 0;overflow:hidden}
  .progress > div{height:100%;width:0;background:var(--orange);transition:width .12s linear}

  .fields{display:flex;flex-direction:column;gap:10px;margin:14px 2px 0}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:.78rem;color:var(--muted);font-weight:600}
  .field input[type=text]{
    border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:1rem;color:var(--ink);background:#fff;width:100%;
  }
  .field input[type=text]:focus{outline:none;border-color:var(--dteal)}
  .check{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);cursor:pointer}
  .check input{width:16px;height:16px;accent-color:var(--dteal)}
  .role{display:flex;align-items:center;gap:8px;margin-top:2px;flex-wrap:wrap}
  .role-label{font-size:.78rem;color:var(--muted);font-weight:600}
  .role-btn{appearance:none;border:2px solid var(--line);background:#fff;color:var(--dteal);border-radius:999px;padding:7px 15px;font-size:.82rem;font-weight:700;cursor:pointer}
  .role-btn.active{background:var(--dteal);color:#fff;border-color:var(--dteal)}

  .zoom-row{display:none;align-items:center;gap:8px;margin-top:14px}
  .zoom-row.show{display:flex}
  .zoom-row .zlabel{font-size:.8rem;color:var(--muted)}
  input[type=range]{flex:1;accent-color:var(--dteal)}
  .zbtn{
    width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:8px;
    font-size:1.2rem;line-height:1;color:var(--turq-dark);cursor:pointer;flex:0 0 auto;
  }
  .zbtn:hover{background:#f0f5f5}

  .hint{margin:10px 2px 0;font-size:.76rem;color:var(--muted);text-align:center}

  .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;justify-content:center}
  .btn{
    appearance:none;border:0;cursor:pointer;
    font-family:'MPText','MPFb','Helvetica Neue',Arial,sans-serif;font-weight:700;
    text-transform:uppercase;letter-spacing:.03em;font-size:.9rem;
    padding:13px 22px;line-height:1;border-radius:999px;
    display:inline-flex;align-items:center;justify-content:center;gap:9px;
    transition:filter .15s,background .15s,opacity .15s;
  }
  .btn:focus-visible{outline:3px solid #9fd9df;outline-offset:2px}
  .btn svg{width:18px;height:18px;flex:0 0 auto}
  .btn-stories{flex:1 1 100%;background:var(--orange);color:#fff;font-size:1rem;padding:15px 22px}
  .btn-stories:hover{filter:brightness(.93)}
  .btn-add{flex:1 1 40%;background:var(--dteal);color:#fff}
  .btn-add:hover{filter:brightness(1.08)}
  .btn-save{flex:1 1 40%;background:var(--green);color:#fff}
  .btn-save:hover{filter:brightness(1.08)}
  .btn-icon{flex:0 0 auto;width:48px;height:48px;padding:0;background:#fff;color:var(--dteal);border:2px solid var(--dteal)}
  .btn-icon svg{width:20px;height:20px}
  .btn-icon:hover{background:#eef6f6}
  .btn-ghost{background:#fff;color:var(--dteal);border:2px solid var(--dteal)}
  .btn-ghost:hover{background:#eef6f6}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .hidden{display:none !important}
  .status{margin:12px auto 0;text-align:center;font-size:.85rem;color:var(--turq-dark);min-height:1.1em}
  .fslink{display:block;text-align:center;margin:8px auto 0;font-size:.9rem;color:var(--orange);font-weight:700;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
  <main class="wrap">
    <div class="stage">
      <div class="canvas-box">
        <canvas id="view" width="1000" height="1778" aria-label="Pré-visualização da moldura"></canvas>
      </div>
      <input type="range" id="zoom" class="vrange" min="1" max="6" step="0.01" value="1" aria-label="Zoom da foto">
    </div>
    <div class="progress hidden" id="progress"><div id="progBar"></div></div>

    <div class="fields">
      <div class="field">
        <label for="nome">Nome</label>
        <input id="nome" type="text" maxlength="42" placeholder="Digite o nome" autocomplete="off">
      </div>
      <div class="field">
        <label for="lotacao">Lotação</label>
        <input id="lotacao" type="text" maxlength="54" placeholder="Digite a lotação" autocomplete="off">
      </div>
      <label class="check"><input type="checkbox" id="upper"> Deixar em MAIÚSCULAS</label>
      <div class="role" role="group" aria-label="Vínculo">
        <span class="role-label">Vínculo:</span>
        <button type="button" class="role-btn active" id="roleEst">Estagiário</button>
        <button type="button" class="role-btn" id="roleRes">Residente</button>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-add" id="addBtn">Adicionar foto ou vídeo</button>
      <button class="btn btn-save hidden" id="saveBtn">Salvar</button>
      <button class="btn btn-icon hidden" id="copyBtn" type="button" title="Copiar imagem" aria-label="Copiar imagem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V5.5A1.5 1.5 0 0 1 6.5 4H15"/></svg>
      </button>
      <button class="btn btn-icon hidden" id="resetBtn" type="button" title="Centralizar" aria-label="Centralizar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3.2M12 18.3v3.2M2.5 12h3.2M18.3 12h3.2"/></svg>
      </button>
    </div>

    <p class="status" id="status"></p>
    <input type="file" id="file" accept="image/*,video/*" class="hidden">
  </main>

  var zoom=1, panX=0, panY=0;
  var nomeVal="", lotVal="", upperOn=false, roleVal="ESTAGIÁRIO";
  var objectUrl=null, recording=false, isDragging=false;

  // ---- Elementos ----
  var canvas=document.getElementById('view');
  var fileInput=document.getElementById('file');
  var addBtn=document.getElementById('addBtn');
  var saveBtn=document.getElementById('saveBtn');
  var copyBtn=document.getElementById('copyBtn');
  var resetBtn=document.getElementById('resetBtn');
  var zoomInput=document.getElementById('zoom');
  var statusEl=document.getElementById('status');
  var nomeInput=document.getElementById('nome');
  var lotInput=document.getElementById('lotacao');
  var upperChk=document.getElementById('upper');
  var roleEst=document.getElementById('roleEst');
  var roleRes=document.getElementById('roleRes');
  var progress=document.getElementById('progress');
  var progBar=document.getElementById('progBar');

  // ---- Helpers ----
  function disp(t){ return upperOn ? (t||'').toLocaleUpperCase('pt-BR') : (t||''); }
  function setStatus(t){ statusEl.textContent=t; }

  function mediaRect(){
    var base=Math.max(WIN.w/mediaW, WIN.h/mediaH), s=base*zoom;
    var dw=mediaW*s, dh=mediaH*s;
    var maxX=Math.max(0,(dw-WIN.w)/2), maxY=Math.max(0,(dh-WIN.h)/2);
    panX=Math.min(maxX,Math.max(-maxX,panX));
    panY=Math.min(maxY,Math.max(-maxY,panY));
    return { dx:WIN.x+WIN.w/2-dw/2+panX, dy:WIN.y+WIN.h/2-dh/2+panY, dw:dw, dh:dh };
  }
  function drawBarText(c, text, bar, hFactor, weight){
    if(!text) return;
    var pad=bar.h*0.30, maxW=bar.w-pad*2, size=Math.round(bar.h*hFactor);
    c.textAlign="center"; c.textBaseline="middle"; c.fillStyle="#ffffff";
    while(size>10){
      c.font=(weight||700)+" "+size+"px 'MPText','MPFb','Helvetica Neue',Arial,system-ui,sans-serif";
      if(c.measureText(text).width<=maxW) break;
      size-=2;
    }
    c.fillText(text, bar.x+bar.w/2, bar.y+bar.h/2 + bar.h*0.03);
  }

  function renderTo(cv, S, ghost){
    var c=cv.getContext('2d');
    c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,cv.width,cv.height); c.scale(S,S);
    c.imageSmoothingEnabled=true; try{ c.imageSmoothingQuality='high'; }catch(e){}

    if(!media){
      c.fillStyle="#e9eef0"; c.fillRect(WIN.x,WIN.y,WIN.w,WIN.h);
      c.fillStyle="#9aa7a8"; c.textAlign="center"; c.textBaseline="middle";
      c.font="18px system-ui,-apple-system,sans-serif";
      c.fillText("Sua foto ou vídeo aqui", WIN.x+WIN.w/2, WIN.y+WIN.h/2);
    } else if(mediaW){
      var r=mediaRect();
      if(ghost){
        try{ c.drawImage(media, r.dx, r.dy, r.dw, r.dh); }catch(e){}   // mostra também o que fica fora
      } else {
        c.save(); c.beginPath(); c.rect(WIN.x,WIN.y,WIN.w,WIN.h); c.clip();
        try{ c.drawImage(media, r.dx, r.dy, r.dw, r.dh); }catch(e){} c.restore();
      }
    }

    if(frameReady){ c.save(); if(ghost) c.globalAlpha=0.5; c.drawImage(frameImg,0,0,IMG_W,IMG_H); c.restore(); }

    drawBarText(c, disp(nomeVal), BAR_NOME, 0.44, 700);
    drawBarText(c, disp(lotVal),  BAR_LOT,  0.58, 500);
    drawBarText(c, roleVal,       BAR_ROLE, 0.62, 700);
  }

  // ---- Loop ----
  var dirty=true;
  function tick(){
    if(mediaType==='video' || isDragging || dirty){ renderTo(canvas, canvas.width/IMG_W, isDragging); dirty=false; }
    if(recording && mediaType==='video' && isFinite(media.duration) && media.duration>0){
      progBar.style.width = Math.min(100, (media.currentTime/media.duration)*100) + '%';
    }
    requestAnimationFrame(tick);
  }
  function invalidate(){ dirty=true; }

  // ---- Interações ----
  function scaleFactor(){ return IMG_W / canvas.getBoundingClientRect().width; }
  var pointers={}, lastDist=0, lastMid=null;
  canvas.addEventListener('pointerdown', function(e){
    if(!media) return;
    canvas.setPointerCapture(e.pointerId);
    pointers[e.pointerId]={x:e.clientX,y:e.clientY};
    isDragging=true; canvas.classList.add('dragging'); lastDist=0; lastMid=null;
  });
  canvas.addEventListener('pointermove', function(e){
    if(!media || !pointers[e.pointerId]) return;
    var prev=pointers[e.pointerId], f=scaleFactor(), ids=Object.keys(pointers);
    if(ids.length>=2){
      pointers[e.pointerId]={x:e.clientX,y:e.clientY};
      var a=pointers[ids[0]], b=pointers[ids[1]];
      var dist=Math.hypot(a.x-b.x,a.y-b.y), mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
      if(lastDist) setZoom(zoom*(dist/lastDist));
      if(lastMid){ panX+=(mid.x-lastMid.x)*f; panY+=(mid.y-lastMid.y)*f; }
      lastDist=dist; lastMid=mid;
    } else {
      panX+=(e.clientX-prev.x)*f; panY+=(e.clientY-prev.y)*f;
      pointers[e.pointerId]={x:e.clientX,y:e.clientY};
    }
    invalidate();
  });
  function endPointer(e){
    delete pointers[e.pointerId];
    if(Object.keys(pointers).length<2){ lastDist=0; lastMid=null; }
    if(Object.keys(pointers).length===0){ isDragging=false; canvas.classList.remove('dragging'); invalidate(); }
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('wheel', function(e){ if(!media) return; e.preventDefault(); setZoom(zoom*(1-e.deltaY*0.0015)); invalidate(); }, {passive:false});
  canvas.addEventListener('dblclick', function(){ if(media){ resetView(); invalidate(); } });

  function setZoom(z){ zoom=Math.min(6,Math.max(1,z)); if(zoomInput) zoomInput.value=zoom.toFixed(2); invalidate(); }
  zoomInput.addEventListener('input', function(){ setZoom(parseFloat(zoomInput.value)); });

  // ---- Campos ----
  nomeInput.addEventListener('input', function(){ nomeVal=nomeInput.value.trim(); invalidate(); });
  lotInput.addEventListener('input', function(){ lotVal=lotInput.value.trim(); invalidate(); });
  upperChk.addEventListener('change', function(){ upperOn=upperChk.checked; invalidate(); });
  function setRole(val,btn){ roleVal=val; roleEst.classList.toggle('active',btn===roleEst); roleRes.classList.toggle('active',btn===roleRes); invalidate(); }
  roleEst.addEventListener('click', function(){ setRole('ESTAGIÁRIO',roleEst); });
  roleRes.addEventListener('click', function(){ setRole('RESIDENTE',roleRes); });

  // ---- Carregar mídia ----
  addBtn.addEventListener('click', function(){ fileInput.click(); });

  function maybeDownscale(src){
    var w=src.width||src.naturalWidth, h=src.height||src.naturalHeight, max=2400, m=Math.max(w,h);
    if(m<=max) return src;
    var s=max/m, cw=Math.round(w*s), ch=Math.round(h*s);
    var cv=document.createElement('canvas'); cv.width=cw; cv.height=ch;
    cv.getContext('2d').drawImage(src,0,0,cw,ch);
    if(src.close){ try{ src.close(); }catch(e){} }
    return cv;
  }
  function loadImageFile(file){
    if(window.createImageBitmap){
      return createImageBitmap(file,{imageOrientation:'from-image'})
        .catch(function(){ return createImageBitmap(file); })
        .then(function(bmp){ return maybeDownscale(bmp); });
    }
    return new Promise(function(res,rej){
      var u=URL.createObjectURL(file), img=new Image();
      img.onload=function(){ URL.revokeObjectURL(u); res(maybeDownscale(img)); };
      img.onerror=function(){ URL.revokeObjectURL(u); rej(); };
      img.src=u;
    });
  }

  fileInput.addEventListener('change', function(){
    var file=fileInput.files && fileInput.files[0];
    if(!file) return;
    clearMedia();
    if(file.type.indexOf('video')===0){
      objectUrl=URL.createObjectURL(file);
      var v=document.createElement('video');
      v.src=objectUrl; v.muted=true; v.loop=true; v.playsInline=true; v.setAttribute('playsinline','');
      v.addEventListener('loadedmetadata', function(){
        mediaW=v.videoWidth; mediaH=v.videoHeight; media=v; mediaType='video';
        resetView(); onMediaReady(); v.play().catch(function(){});
      });
      v.addEventListener('error', function(){ setStatus('Não foi possível abrir esse vídeo.'); });
    } else {
      setStatus('Carregando imagem…');
      loadImageFile(file).then(function(el){
        mediaW=el.width||el.naturalWidth; mediaH=el.height||el.naturalHeight;
        media=el; mediaType='image'; resetView(); onMediaReady();
      }).catch(function(){ setStatus('Não foi possível abrir essa imagem.'); });
    }
    fileInput.value='';
  });

  function onMediaReady(){
    saveBtn.classList.remove('hidden');
    resetBtn.classList.remove('hidden');
    var isImg = mediaType==='image';
    saveBtn.textContent = isImg ? 'Salvar foto' : 'Salvar vídeo';
    if(isImg && navigator.clipboard && window.ClipboardItem) copyBtn.classList.remove('hidden');
    else copyBtn.classList.add('hidden');
    addBtn.textContent='Trocar mídia';
    setStatus(''); invalidate();
  }
  function resetView(){ zoom=1; panX=0; panY=0; if(zoomInput) zoomInput.value='1'; }
  resetBtn.addEventListener('click', function(){ resetView(); invalidate(); });
  function clearMedia(){
    if(media && mediaType==='video'){ try{media.pause();}catch(e){} }
    if(media && media.close){ try{media.close();}catch(e){} }
    if(objectUrl){ URL.revokeObjectURL(objectUrl); objectUrl=null; }
    media=null; mediaType=null; mediaW=0; mediaH=0;
  }

  // ---- Nome do arquivo ----
  function baseName(){
    var n=(nomeVal||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
    return 'moldura-mppr'+(n?'-'+n:'');
  }
  function download(blob,name){
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },2000);
  }
  function photoBlob(cb){
    var S=1, ec=document.createElement('canvas'); ec.width=IMG_W*S; ec.height=IMG_H*S;
    renderTo(ec,S,false);
    ec.toBlob(function(b){ cb(b); },'image/png');
  }

  // ---- Salvar / Copiar ----
  saveBtn.addEventListener('click', function(){
    if(!media) return;
    if(mediaType==='video') recordVideo();
    else photoBlob(function(b){ if(b){ download(b,baseName()+'.png'); setStatus('Foto salva ✓'); } });
  });
  copyBtn.addEventListener('click', function(){
    if(!media || mediaType!=='image') return;
    if(!navigator.clipboard || !window.ClipboardItem){ setStatus('Cópia não suportada aqui.'); return; }
    photoBlob(function(b){
      if(!b) return;
      navigator.clipboard.write([new ClipboardItem({'image/png':b})])
        .then(function(){ setStatus('Imagem copiada ✓'); })
        .catch(function(){ setStatus('Não foi possível copiar. Use Salvar.'); });
    });
  });

  // ---- Vídeo (gravação + áudio via Web Audio) ----
  function pickMime(){
    var c=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4',
           'video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
    for(var i=0;i<c.length;i++){ try{ if(MediaRecorder.isTypeSupported(c[i])) return c[i]; }catch(e){} }
    return '';
  }
  function extFor(m){ return (m && m.indexOf('mp4')>=0)?'mp4':'webm'; }
  var audioCtx=null;
  function videoHasAudio(v){
    return !!(v.mozHasAudio || (typeof v.webkitAudioDecodedByteCount==='number' && v.webkitAudioDecodedByteCount>0) || (v.audioTracks && v.audioTracks.length>0));
  }
  function buildAudioTracks(v){
    try{
      var AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return [];
      if(!audioCtx) audioCtx=new AC();
      if(audioCtx.state==='suspended') audioCtx.resume();
      if(!v._mpprSrc){ v._mpprSrc=audioCtx.createMediaElementSource(v); }
      var dest=audioCtx.createMediaStreamDestination();
      v._mpprSrc.connect(dest); v._mpprSrc.connect(audioCtx.destination);
      return dest.stream.getAudioTracks();
    }catch(e){ return []; }
  }
  function recordVideo(){
    if(recording) return;
    if(!window.MediaRecorder || !canvas.captureStream){
      setStatus('Este navegador não permite salvar vídeo. Tente Chrome (PC/Android) ou salve uma foto.'); return;
    }
    var v=media, mime=pickMime(), stream=canvas.captureStream(30);
    var aTracks=buildAudioTracks(v);
    if(!aTracks.length){
      try{ var vs=v.captureStream?v.captureStream():(v.mozCaptureStream?v.mozCaptureStream():null); if(vs) aTracks=vs.getAudioTracks(); }catch(e){}
    }
    aTracks.forEach(function(t){ try{ stream.addTrack(t); }catch(e){} });
    var noAudio=(aTracks.length===0) && videoHasAudio(v);

    var rec;
    try{ rec=mime?new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8000000}):new MediaRecorder(stream); }
    catch(e){ try{ rec=new MediaRecorder(stream); }catch(e2){ setStatus('Não foi possível iniciar a gravação.'); return; } }

    var chunks=[], started=false, safety=null;
    rec.ondataavailable=function(e){ if(e.data&&e.data.size) chunks.push(e.data); };
    rec.onstop=function(){
      if(safety){ clearTimeout(safety); safety=null; }
      recording=false; saveBtn.disabled=false; addBtn.disabled=false;
      progress.classList.add('hidden'); progBar.style.width='0';
      try{ if(v._mpprSrc) v._mpprSrc.disconnect(); }catch(e){}
      v.onended=null; v.loop=true; v.muted=true; try{ v.currentTime=0; v.play(); }catch(e){}
      var blob=new Blob(chunks,{type:rec.mimeType||mime||'video/webm'});
      if(!blob.size){ setStatus('Não consegui gravar o vídeo aqui 😕 — tente salvar como foto, ou use o Chrome no PC/Android.'); return; }
      var ext=extFor(blob.type);
      download(blob, baseName()+'.'+ext);
      if(ext!=='mp4') setStatus('Vídeo salvo em WEBM — os Stories do Instagram não aceitam WEBM. Para MP4, use o Chrome no computador ou no Android.');
      else setStatus(noAudio ? 'Vídeo salvo (MP4) — sem áudio (limitação do navegador).' : 'Vídeo salvo em MP4 ✓');
    };
    var stop=function(){ if(rec.state!=='inactive'){ try{ rec.stop(); }catch(e){} } };
    var begin=function(){
      if(started || rec.state!=='inactive') return;
      started=true;
      try{ rec.start(250); }
      catch(e){ recording=false; saveBtn.disabled=false; addBtn.disabled=false; progress.classList.add('hidden'); setStatus('Não foi possível iniciar a gravação.'); }
    };

    recording=true; saveBtn.disabled=true; addBtn.disabled=true;
    progress.classList.remove('hidden'); progBar.style.width='0';
    setStatus('Gravando vídeo… aguarde tocar do início ao fim.');

    v.loop=false; v.muted=false; v.volume=1;
    var dur=(isFinite(v.duration) && v.duration>0) ? v.duration : 15;   // evita setTimeout(NaN) que parava na hora
    v.onended=function(){ stop(); };
    safety=setTimeout(stop, Math.min(120000, dur*1000+2000));
    try{ v.currentTime=0; }catch(e){}
    var onPlaying=function(){ v.removeEventListener('playing', onPlaying); begin(); };
    v.addEventListener('playing', onPlaying);                            // só grava quando o vídeo está tocando (garante frames)
    var p=v.play(); if(p&&p.catch){ p.catch(function(){ v.play().catch(function(){}); }); }
    setTimeout(begin, 700);                                              // fallback se 'playing' não disparar
  }

  invalidate();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
