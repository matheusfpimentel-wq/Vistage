<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0b10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vistage" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- 180x180 é o tamanho que o iOS pede; apontar pro 192 fazia ele
         reescalar e perder nitidez. O iOS IGNORA o manifesto pra ícone de
         tela de início: é esta linha que vale. -->
    <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
    <!-- O ícone é uma imagem, não um desenho vetorial: não há SVG fiel pra
         servir de favicon. O PNG de 192 serve, e o navegador reduz. -->
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <title>Vistage</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
