<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>MusicGest — autorização concluída</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #0f0f17;
        color: #eee;
      }
      .card {
        max-width: 420px;
        padding: 32px;
        text-align: center;
        background: #1a1a25;
        border: 1px solid #2a2a3a;
        border-radius: 12px;
      }
      h1 { margin: 0 0 8px; font-size: 20px; }
      p  { margin: 8px 0 0; color: #aaa; font-size: 14px; line-height: 1.5; }
      .check {
        width: 56px; height: 56px;
        border-radius: 999px;
        background: #10b981;
        display: grid; place-items: center;
        margin: 0 auto 16px;
        color: white; font-size: 28px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="check">&check;</div>
      <h1>Autorização concluída</h1>
      <p>Pode fechar essa janela — o MusicGest já recebeu a permissão.</p>
    </div>
  </body>
</html>
