[package]
name = "musicgest"
version = "1.0.0"
description = "Sistema de gestão para negócio musical"
authors = ["Matheus Pimentel"]
edition = "2021"

[lib]
name = "musicgest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
# Turso (libsql) com réplica embarcada: leituras sempre da réplica local
# (funciona offline), escritas vão para a réplica E para o Turso; o libsql faz
# o sync. `rusqlite` é usado só pela migração one-shot de um .db SQLite legado.
libsql = { version = "0.9", default-features = false, features = ["core", "replication", "remote"] }
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "2", features = ["json", "tls"] }
sha2 = "0.10"
base64 = "0.22"
urlencoding = "2"
rand = "0.8"
