[package]
name = "musicgest"
version = "1.0.0"
description = "Sistema de gestão para negócio musical"
authors = ["Matheus Pimentel"]
edition = "2021"

[lib]
name = "musicgest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
# libsql como banco LOCAL (new_local) — um arquivo SQLite na máquina, sem nuvem.
# Mantemos as features default do libsql; as de rede (remote/sync/tls) ficam
# ociosas agora, mas removê-las é desnecessário e arriscaria o build.
libsql = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "2", features = ["json", "tls"] }
sha2 = "0.10"
base64 = "0.22"
urlencoding = "2"
rand = "0.8"
