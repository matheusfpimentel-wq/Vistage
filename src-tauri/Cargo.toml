[package]
name = "vistage"
version = "1.0.0"
description = "Sistema de gestão para negócio musical"
authors = ["Matheus Pimentel"]
edition = "2021"

[lib]
name = "vistage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
# libsql como banco LOCAL (new_local) — um arquivo SQLite na máquina, sem nuvem.
# Mantemos as features default do libsql; as de rede (remote/sync/tls) ficam
# ociosas agora, mas removê-las é desnecessário e arriscaria o build.
libsql = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "2", features = ["json", "tls"] }
sha2 = "0.10"
base64 = "0.22"
urlencoding = "2"
rand = "0.8"
# Biblioteca de Músicas: ler/gravar tags (ID3/MP4/FLAC/Vorbis/AIFF) + varredura.
lofty = "0.18"
walkdir = "2"

# Binário de release menor: remove símbolos de debug, LTO, uma única unidade de
# codegen e otimização por tamanho. O build de release fica mais lento — aceitável
# porque só roda ao empacotar. Sem custo funcional.
[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
