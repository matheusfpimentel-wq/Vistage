[package]
name = "musicgest"
version = "1.0.0"
description = "Sistema de gestão para negócio musical"
authors = ["Matheus Pimentel"]
edition = "2021"

[lib]
name = "musicgest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Dependência direta do mesmo sqlx que o tauri-plugin-sql usa, só para alcançar
# o static global sqlx::sqlite::CREATE_DB_WAL e desligar a criação de bancos em
# modo WAL (ver lib.rs). Precisa resolver para a MESMA versão (0.8.x) do lock
# para mexer no mesmo static.
sqlx = { version = "0.8", default-features = false, features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "2", features = ["json", "tls"] }
sha2 = "0.10"
base64 = "0.22"
urlencoding = "2"
rand = "0.8"
