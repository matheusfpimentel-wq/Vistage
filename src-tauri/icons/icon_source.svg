<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#1A0D2E"/>

  <!-- Bullseye rings — purple tones -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="#7C3AED" stroke-width="18"/>
  <circle cx="256" cy="256" r="158" fill="none" stroke="#7C3AED" stroke-width="18"/>
  <circle cx="256" cy="256" r="98"  fill="none" stroke="#7C3AED" stroke-width="18"/>
  <!-- Bull's eye filled -->
  <circle cx="256" cy="256" r="34"  fill="#7C3AED"/>

  <!--
    Gaivota / seagull V: filled shape, pointed at both wing tips,
    thickening smoothly toward the center bottom point.
    Outer edge: wide bezier curve from tip-to-tip via center.
    Inner edge: tighter bezier slightly above, creating a tapering filled wing.
  -->
  <path d="
    M 134 108
    C 160 145, 230 238, 256 270
    C 282 238, 352 145, 378 108
    C 370 102, 362 100, 354 104
    C 330 138, 276 222, 256 248
    C 236 222, 182 138, 158 104
    C 150 100, 142 102, 134 108
    Z"
        fill="#C4B5FD"/>
</svg>
