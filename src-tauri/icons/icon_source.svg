<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#1A0D2E"/>

  <!-- Bullseye rings — purple tones -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="#7C3AED" stroke-width="18"/>
  <circle cx="256" cy="256" r="158" fill="none" stroke="#7C3AED" stroke-width="18"/>
  <circle cx="256" cy="256" r="98"  fill="none" stroke="#7C3AED" stroke-width="18"/>
  <!-- Bull's eye filled -->
  <circle cx="256" cy="256" r="34"  fill="#7C3AED"/>

  <!--
    Stylized V: two arms curving gently inward, tips pointed at both ends.
    Uses a cubic bezier so the arms have a slight inward curve (more elegant).
    The V is lighter/thinner than before — discreto.
    Tips: top-left (138, 96) and top-right (374, 96), meeting at center (256, 272).
    Control points pull each arm slightly inward to give a curved, pointed feel.
  -->
  <path d="M 138 96 C 160 130, 234 230, 256 272 C 278 230, 352 130, 374 96"
        fill="none"
        stroke="#C4B5FD"
        stroke-width="24"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
